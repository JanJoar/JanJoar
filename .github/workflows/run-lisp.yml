name: Update Github Blog list

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 */12 * * *" # every 4 hours

jobs:
  run-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sbcl
        run: sudo apt-get update && sudo apt-get install -y sbcl

      - name: Install Quicklisp
        run: |
          curl -O https://beta.quicklisp.org/quicklisp.lisp
          sbcl --noinform --non-interactive \
               --load quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)' \
               --eval '(ql-util:without-prompting (ql:add-to-init-file))' \
               --quit
               
      - name: Install Dependencies
        run: |
          sbcl --noinform --non-interactive \
               --eval '(ql:quickload "drakma")' \
               --eval '(ql:quickload "xmls")' \
               --quit

      - name: Update README
        run: |
          sbcl --load ~/.sbclrc --script main.lisp
          git config --local user.name "github-actions"
          git config --local user.email "github-actions@github.com"

      - name: Check for changes
        id: check_changes
        run: |
          git diff --exit-code || echo "changed"
          echo "output=$output" >> $GITHUB_ENV
          
      - name: Commit changes
        if: contains(env.output, 'changed')
        run: |
          git add README.org
          git commit -m "Update README with latest blogs"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
